<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>태극기를 되찾아라</title>
<meta property="og:title" content="태극기를 되찾아라 — 8월 15일 광복절" />
<meta property="og:description" content="빼앗긴 것을 되찾고 태극기를 그려 게양하는 초등 저학년 광복절 게임." />
<meta property="og:image" content="assets/og.jpg" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --pt:#E8503A; --pt-dk:#B23726;
  --amber:#F0B429; --amber-dk:#C08A12; --blue:#2B64C4;
  --bg:#131A2E; --bg2:#1A2340; --card:#20294A; --bd:#33406B;
  --tx:#F2EFE6; --tx2:#9AA5C7;
  --ok:#3ECF8E; --ok-bg:rgba(62,207,142,.14);
  --err:#FF5D5D; --err-bg:rgba(255,93,93,.15);
  --r-s:12px; --r-c:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  word-break:keep-all; overflow-wrap:break-word; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
img{display:block;max-width:100%}

/* ---------- 공통 뼈대 ---------- */
#app{min-height:100svh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:14px 16px 34px;flex:1;display:flex;flex-direction:column}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 18px;
  border-radius:var(--r-s);background:var(--amber);color:#2A1B02;font-size:18px;font-weight:800;line-height:1.35;
  box-shadow:0 4px 0 var(--amber-dk);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--amber-dk)}
.btn.sub{background:var(--card);border:1px solid var(--bd);color:var(--tx);box-shadow:0 4px 0 #141A30}
.btn:disabled{opacity:.45;box-shadow:none;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0;min-width:0}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:rgba(15,22,40,.96);border-bottom:1px solid var(--bd)}
.hud-in{max-width:720px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.hearts{font-size:18px;letter-spacing:1px;flex:0 0 auto}
.hearts b{opacity:.22}
.hud-sc{margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.pill{height:32px;padding:0 11px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);
  border-radius:9px;background:var(--bg2);font-size:14px;font-weight:800;white-space:nowrap}
.pbar{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;max-width:720px;margin:0 auto}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pt),var(--amber));transition:width .4s}

/* ---------- 표지 ---------- */
.cover{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:100svh;padding:0}
.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.cover::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(19,26,46,.15) 0%,rgba(19,26,46,.82) 52%,rgba(19,26,46,.98) 78%)}
.cover-in{position:relative;z-index:2;width:100%;max-width:720px;margin:0 auto;padding:0 18px 30px;text-align:center}
.tag{display:inline-block;padding:5px 12px;border-radius:99px;background:rgba(232,80,58,.9);color:#fff;
  font-size:13px;font-weight:800;letter-spacing:.02em;margin-bottom:12px}
.cover h1{margin:0 0 10px;font-size:clamp(38px,10vw,60px);line-height:1.05;letter-spacing:-.045em;
  text-shadow:0 4px 24px rgba(0,0,0,.5)}
.cover p{margin:0 auto 20px;max-width:430px;font-size:17px;line-height:1.7;color:rgba(255,255,255,.9)}
.strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.sp{padding:7px 11px;border:1px solid var(--bd);border-radius:99px;background:rgba(26,35,64,.85);
  font-size:13px;font-weight:700;color:var(--tx2)}
.credit{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:rgba(255,255,255,.42);
  font-size:12px;text-decoration:none}
.credit:hover{color:rgba(255,255,255,.8)}

/* ---------- 이야기 ---------- */
.pic{position:relative;border-radius:var(--r-c);overflow:hidden;border:1px solid var(--bd);background:#0E1628;
  box-shadow:0 12px 34px rgba(0,0,0,.4);aspect-ratio:1400/933}
.pic>img{width:100%;height:100%;object-fit:cover}
.pic.tall{aspect-ratio:auto}
.story-card{margin-top:14px;padding:18px 18px 16px;border:1px solid var(--bd);border-radius:var(--r-c);background:var(--card)}
.story-card p{margin:0 0 8px;font-size:clamp(17px,4.4vw,20px);line-height:1.75;font-weight:600;color:rgba(255,255,255,.9)}
.story-card p:last-child{margin-bottom:0}
.story-card p.on{color:var(--amber)}
.stitle{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.stitle i{width:30px;height:30px;border-radius:9px;background:var(--pt);display:grid;place-items:center;
  font-style:normal;font-size:15px;font-weight:800;color:#fff;flex:0 0 auto}
.stitle b{font-size:15px;font-weight:800;color:var(--amber);letter-spacing:.02em}
.ask{margin:14px 0 0;font-size:16px;font-weight:700;color:var(--tx2);text-align:center;line-height:1.6}

/* ---------- 찾기 ---------- */
.scene{position:relative;border-radius:var(--r-c);overflow:hidden;border:1px solid var(--bd);
  background:#0E1628;aspect-ratio:1400/933;cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.hot{position:absolute;background:transparent;padding:0;cursor:inherit;border-radius:12px}
.hot::after{content:"";position:absolute;inset:0;border-radius:12px;border:3px solid transparent;transition:.16s}
.hot.hint::after{border-color:var(--amber);animation:pulse 1s ease-in-out 3}
.hot.got::after{border-color:var(--ok);background:rgba(62,207,142,.22)}
.hot.got::before{content:"✓";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:32px;height:32px;border-radius:50%;background:var(--ok);color:#08281B;font-size:17px;font-weight:800;
  display:grid;place-items:center}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(240,180,41,.2)}}
.miss{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:3px solid var(--err);color:var(--err);font-size:18px;font-weight:800;display:grid;place-items:center;
  animation:fade 1s ease forwards;pointer-events:none}
@keyframes fade{0%{transform:scale(.5);opacity:1}70%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{padding:9px 13px;border:1px solid var(--bd);border-radius:99px;background:var(--bg2);
  font-size:14px;font-weight:700;color:var(--tx2)}
.chip.on{border-color:var(--ok);background:var(--ok-bg);color:var(--tx)}

/* 손전등 */
.dark .scene>img{filter:brightness(.16)}
.torch{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle 108px at var(--mx,50%) var(--my,50%),
    rgba(0,0,0,0) 0%, rgba(0,0,0,.05) 42%, rgba(0,0,0,.93) 72%, rgba(0,0,0,.97) 100%)}

/* ---------- 선택지 ---------- */
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--bd);border-radius:var(--r-s);
  background:var(--bg2);padding:15px 16px;font-size:16px;font-weight:700;line-height:1.5;
  box-shadow:0 4px 0 #0E1426;transition:transform .06s,box-shadow .06s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #0E1426}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.no{border-color:var(--err);background:var(--err-bg)}
.ox{display:flex;gap:12px;margin-top:14px}
.ox button{flex:1;height:96px;border-radius:var(--r-c);border:2px solid var(--bd);background:var(--bg2);
  font-size:40px;font-weight:800;box-shadow:0 5px 0 #0E1426;transition:transform .06s,box-shadow .06s}
.ox button:active{transform:translateY(3px);box-shadow:0 2px 0 #0E1426}

/* ---------- 순서 맞추기 ---------- */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.oc{position:relative;border:2px solid var(--bd);border-radius:var(--r-s);background:var(--bg2);
  padding:14px 12px;font-size:15px;font-weight:700;line-height:1.45;text-align:left;min-height:78px;
  box-shadow:0 4px 0 #0E1426;transition:transform .06s,box-shadow .06s}
.oc:active{transform:translateY(3px);box-shadow:0 1px 0 #0E1426}
.oc.done{border-color:var(--ok);background:var(--ok-bg);opacity:.85}
.oc.done::after{content:attr(data-n);position:absolute;top:-11px;right:-9px;width:28px;height:28px;
  border-radius:50%;background:var(--ok);color:#08281B;font-size:15px;font-weight:800;display:grid;place-items:center}

/* ---------- 태극기 ---------- */
.flagbox{border-radius:var(--r-c);overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.45);background:#fff;
  aspect-ratio:3/2;width:100%}
.flagbox svg{width:100%;height:100%;display:block}
.fp{opacity:0;transition:opacity .45s}
.fp.on{opacity:1}
.fp.on>g,.fp.on>circle,.fp.on>path{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.55)}62%{transform:scale(1.1)}100%{transform:scale(1)}}
.guide{stroke:#C9CEDA;stroke-width:2;stroke-dasharray:6 5;fill:none}
.pieces{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pc{min-width:88px;padding:13px 14px;border:2px solid var(--bd);border-radius:var(--r-s);background:var(--bg2);
  font-size:17px;font-weight:800;box-shadow:0 4px 0 #0E1426;transition:transform .06s,box-shadow .06s}
.pc:active{transform:translateY(3px);box-shadow:0 1px 0 #0E1426}
.pc.next{border-color:var(--amber);box-shadow:0 4px 0 var(--amber-dk),0 0 0 3px rgba(240,180,41,.22)}
.pc.done{opacity:.32;box-shadow:none}
.pc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 게양 */
.pole{position:relative;width:100%;aspect-ratio:1/1;max-height:56svh;margin:0 auto;border-radius:var(--r-c);
  overflow:hidden;border:1px solid var(--bd)}
.pole-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.78)}
.pole-stick{position:absolute;left:22%;top:5%;bottom:6%;width:7px;border-radius:4px;
  background:linear-gradient(90deg,#D8D3C6,#8C8577)}
.pole-top{position:absolute;left:22%;top:3.4%;width:15px;height:15px;margin-left:-4px;border-radius:50%;background:var(--amber)}
.pole-flag{position:absolute;left:calc(22% + 7px);width:39%;aspect-ratio:3/2;background:#fff;
  border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:bottom .5s cubic-bezier(.3,1.2,.5,1)}
.pole-flag svg{width:100%;height:100%;display:block}
.pole-flag.up{animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0) skewY(0)}35%{transform:rotate(-.8deg) skewY(1.4deg)}70%{transform:rotate(.7deg) skewY(-1.2deg)}}

/* ---------- 결과 카드(모달) ---------- */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(8,12,24,.72);display:flex;align-items:flex-end;
  justify-content:center;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet-in{width:100%;max-width:520px;border:1px solid var(--bd);border-radius:var(--r-c);background:var(--card);
  padding:20px 18px 18px;animation:up .28s cubic-bezier(.2,1,.4,1)}
@keyframes up{from{transform:translateY(26px);opacity:0}}
.sheet h3{margin:0 0 6px;font-size:22px;letter-spacing:-.03em}
.badge-pop{display:flex;align-items:center;gap:11px;margin:0 0 14px}
.badge-pop i{width:44px;height:44px;border-radius:12px;background:var(--amber);color:#2A1B02;
  display:grid;place-items:center;font-style:normal;font-size:21px;flex:0 0 auto}
.rule{display:flex;gap:10px;align-items:flex-start;padding:14px;border:2px solid var(--ok);
  border-radius:var(--r-s);background:var(--ok-bg);margin-bottom:14px}
.rule i{color:var(--ok);font-style:normal;font-size:18px;font-weight:800;flex:0 0 auto}
.rule p{margin:0;font-size:17px;font-weight:800;line-height:1.55}
.sheet .lead{margin:0 0 14px;font-size:16px;line-height:1.7;color:var(--tx2)}

/* ---------- 엔딩 ---------- */
.end h2{margin:0 0 8px;font-size:clamp(28px,7vw,40px);line-height:1.15;letter-spacing:-.04em;text-align:center}
.end .sub{margin:0 0 18px;text-align:center;font-size:16px;line-height:1.7;color:var(--tx2)}
.grade{width:104px;height:104px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  font-size:44px;font-weight:800;color:#2A1B02;background:var(--amber);box-shadow:0 0 0 8px rgba(240,180,41,.16)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--bd);border-radius:var(--r-c);
  overflow:hidden;background:var(--bg2);margin-bottom:16px}
.stats>div{padding:13px 10px;text-align:center}
.stats>div+div{border-left:1px solid var(--bd)}
.stats span{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.stats b{font-size:20px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.bd{padding:11px 8px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--bg2);text-align:center}
.bd i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.bd b{display:block;font-size:12px;font-weight:700;line-height:1.35}
.bd.off{opacity:.3}
.namerow{display:flex;gap:9px;margin:4px 0 12px}
.namerow input{flex:1 1 0;min-width:0;height:52px;padding:0 14px;border-radius:var(--r-s);
  border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:16px;font-family:inherit}
.namerow .btn{flex:0 0 auto;width:132px;min-height:52px;font-size:15px}

.hidden{display:none !important}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;padding:13px 20px;
  border-radius:12px;background:rgba(10,16,32,.96);border:1px solid var(--bd);font-size:15px;font-weight:700;
  max-width:90vw;text-align:center}
.dbg .hot::after{border-color:#FF2D55 !important;background:rgba(255,45,85,.12)}

@media (max-width:430px){
  .wrap{padding:12px 13px 30px}
  /* 찾기 그림은 화면 폭 끝까지 — 작은 화면에서 조금이라도 크게 */
  .scene{margin:0 -13px;width:calc(100% + 26px);border-radius:0;border-left:0;border-right:0}
  .cards{grid-template-columns:1fr}
  .badges{grid-template-columns:repeat(2,1fr)}
  .pc{min-width:74px;padding:12px;font-size:15px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   태극기를 되찾아라 — 초등 저학년 광복절 게임
   스테이지마다 게임 종류가 다르다: 찾기 / 낱말 / 선택 / 손전등 / 순서 / 그리기 / 게양
   ============================================================ */
const DBG = new URLSearchParams(location.search).has("debug");
const app = document.getElementById("app");
const IMG = "assets/scenes/";

const AUDIO = { story:"assets/audio/bgm-story.mp3", calm:"assets/audio/bgm-calm.mp3",
                night:"assets/audio/bgm-night.mp3", joy:"assets/audio/bgm-joy.mp3" };

/* ---------- 스테이지 정의 ---------- */
const ST = [
{ id:"home", no:1, name:"우리 집", badge:"우리 집", icon:"🏠", music:"calm",
  story:{ img:IMG+"story-peace.jpg", lines:["옛날 우리 마을에는 웃음소리가 가득했어요.","그런데 일본이 우리나라를 빼앗아 갔어요."] },
  game:"find",
  title:"우리 집에서 사라진 것을 찾아라",
  ask:"이상한 곳 다섯 군데를 눌러 보세요.",
  img:IMG+"scene1-before.jpg", after:IMG+"scene1-after.jpg",
  rule:"내 이름과 우리 물건은 소중해요!",
  win:"우리 집을 되찾았어요!",
  spots:[
    { id:"flag",  label:"일본 깃발",     x:4,  y:5,  w:19, h:22 },
    { id:"name",  label:"바뀐 문패",     x:3,  y:34, w:15, h:26 },
    { id:"tag",   label:"일본 이름표",   x:48, y:48, w:16, h:19 },
    { id:"brass", label:"빼앗긴 놋그릇", x:63, y:68, w:28, h:23 },
    { id:"cloth", label:"못 입는 한복",  x:79, y:42, w:17, h:17 },
  ] },

{ id:"school", no:2, name:"우리 학교", badge:"우리말", icon:"📖", music:"calm",
  story:{ img:IMG+"scene2-before.jpg", lines:["학교에서도 우리말을 쓸 수 없었어요.","우리글을 배우는 것도 안 된다고 했지요."] },
  game:"word",
  title:"우리말을 지켜라",
  ask:"우리말을 골라 주세요.",
  rule:"우리말과 우리글은 우리가 지켜요!",
  win:"우리말을 지켜 냈어요!",
  quiz:[
    { q:"우리 이름은 어느 쪽일까요?", opts:["김영희","가네다 히데코"], answer:0, why:"이름을 일본식으로 바꾸라고 시켰어요." },
    { q:"우리글로 쓴 것은 어느 쪽일까요?", opts:["がっこう","학교"], answer:1, why:"한글은 우리가 만든 우리 글자예요." },
    { q:"우리나라 꽃은 무엇일까요?", opts:["무궁화","벚꽃"], answer:0, why:"무궁화는 우리나라를 나타내는 꽃이에요." },
  ] },

{ id:"town", no:3, name:"우리 마을", badge:"우리 마을", icon:"🏘️", music:"calm",
  story:{ img:IMG+"scene3-before.jpg", lines:["마을도 조용해졌어요.","하고 싶은 말을 마음껏 할 수 없었어요."] },
  game:"choice",
  title:"어떻게 해야 할까요?",
  ask:"",
  rule:"우리 것을 지키려면 용기가 필요해요!",
  win:"슬기롭게 지켜 냈어요!",
  cases:[
    { q:"골목에서 친구가 태극기를 들고 있어요.\n순사가 오고 있어요. 어떻게 할까요?",
      opts:["친구에게 얼른 숨기라고 알려 준다","큰 소리로 친구 이름을 부른다","모른 척 혼자 도망간다"],
      answer:0, why:"위험을 먼저 알려 주면 친구를 지킬 수 있어요." },
    { q:"할머니가 우리말 책을 주셨어요.\n일본 선생님이 검사를 온대요.",
      opts:["책을 불에 태운다","책을 잘 숨겨 두었다가 밤에 읽는다","교실에 그냥 두고 간다"],
      answer:1, why:"지키려는 마음이 우리말을 살렸어요." },

/* ---------- 상태 ---------- */
const S = { view:"cover", idx:0, hearts:3, score:0, got:[], badges:[], sub:0, name:"" };
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur = () => ST[S.idx];

/* ---------- 소리 ---------- */
let bgm = null, bgmKey = null, ac = null, muted = false;
function actx(){ if (muted) return null; const A = window.AudioContext||window.webkitAudioContext; if(!A) return null;
  ac = ac || new A(); if (ac.state === "suspended") ac.resume(); return ac; }
function sfx(kind){
  const c = actx(); if(!c) return;
  const map = { ok:[660,990,.17], no:[220,150,.22], tap:[520,520,.05], win:[523,1175,.5], up:[440,880,.12] };
  const [f1,f2,d] = map[kind] || map.tap;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = kind === "no" ? "sawtooth" : "sine";
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(kind==="no"?.05:.09,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
}
function music(key){
  if (muted || !AUDIO[key]) { if(bgm) bgm.pause(); bgmKey=null; return; }
  if (bgmKey === key && bgm && !bgm.paused) return;
  if (!bgm) { bgm = new Audio(); bgm.loop = true; bgm.volume = .34; }
  bgm.pause(); bgm.src = AUDIO[key]; bgmKey = key;
  bgm.play().catch(()=>{ bgmKey = null; });
}
function toggleMute(){
  muted = !muted;
  if (muted) { if(bgm) bgm.pause(); bgmKey = null; } else music(cur() ? cur().music : "story");
  draw();
}

/* ---------- 토스트 ---------- */
let tT = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d); clearTimeout(tT); tT = setTimeout(()=>d.remove(), 2200);
}

/* ---------- 태극기 SVG ---------- */
function bars(broken){
  const L=46,T=7.5,G=5.5,H=(L-8)/2; let o="";
  [0,1,2].forEach(i=>{ const y=(i-1)*(T+G)-T/2;
    if (broken.includes(i)) { o+=`<rect x="${-L/2}" y="${y}" width="${H}" height="${T}"/><rect x="${L/2-H}" y="${y}" width="${H}" height="${T}"/>`; }
    else o+=`<rect x="${-L/2}" y="${y}" width="${L}" height="${T}"/>`;
  });
  return o;
}
const TRI = { geon:{b:[],x:75,y:50,r:-56.31}, gam:{b:[0,2],x:225,y:50,r:56.31},
              ri:{b:[1],x:75,y:150,r:56.31},  gon:{b:[0,1,2],x:225,y:150,r:-56.31} };
/* 바깥 g = 애니메이션, 안쪽 g = 위치·회전 (한 요소에 겹치면 CSS가 SVG transform을 덮어쓴다) */
function flagSvg(done, guide){
  const on = id => done.includes(id) ? "fp on" : "fp";
  const gd = guide ? `<circle class="guide" cx="150" cy="100" r="50"/>` +
    Object.values(TRI).map(t=>`<rect class="guide" x="${t.x-26}" y="${t.y-16}" width="52" height="32" rx="4"/>`).join("") : "";
  const tri = Object.entries(TRI).map(([id,t]) =>
    `<g class="${on(id)}" fill="#000"><g transform="translate(${t.x},${t.y}) rotate(${t.r})">${bars(t.b)}</g></g>`).join("");
  return `<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="태극기">
    <rect width="300" height="200" fill="#fff"/>${gd}
    <g class="${on("taegeuk")}">
      <circle cx="150" cy="100" r="50" fill="#0047a0"/>
      <path d="M100,100 A50,50 0 0,1 200,100 A25,25 0 0,0 150,100 A25,25 0 0,1 100,100 Z" fill="#cd2e3a"/>
    </g>${tri}</svg>`;
}

/* 읽어주기 — assets/voice 에 mp3를 넣으면 그 목소리로 바뀐다 */
const VOICE_READY = false;
let sp = null;
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch{} if(sp){ sp.pause(); sp=null; }
  document.querySelectorAll(".story-card p.on").forEach(p=>p.classList.remove("on")); }
function speak(lines){
  stopSpeak();
  const mark = i => document.querySelectorAll(".story-card p").forEach((p,n)=>p.classList.toggle("on", n===i));
  if (VOICE_READY) {
    const a = new Audio(`assets/voice/${cur().id}.mp3`); sp = a; mark(0);
    a.onended = () => { sp=null; mark(-1); }; a.onerror = () => { sp=null; browser(); };
    a.play().catch(()=>{ sp=null; browser(); });
    return;
  }
  browser();
  function browser(){
    if (!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
    const sc = v => (/natural|neural|online/i.test(v.name)?3:0) + (v.localService?0:1);
    const v = vs.sort((a,b)=>sc(b)-sc(a))[0];
    lines.forEach((line,i)=>{
      const u = new SpeechSynthesisUtterance(line);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "ko-KR";
      u.rate = .9; u.pitch = 1.02;
      u.onstart = () => mark(i);
      if (i === lines.length-1) u.onend = () => mark(-1);
      speechSynthesis.speak(u);
    });
  }
}

}

function viewFind(){
  const st = cur(), dark = st.game === "dark";
  const all = st.spots.length;
  app.innerHTML = shell(st, `
    <div class="scene${dark?" dark":""}" id="scene">
      <img src="${esc(st.img)}" alt="" />
      ${st.spots.map(s=>{
        const got = S.got.includes(s.id);
        return `<button class="hot${got?" got":""}" data-id="${s.id}"
          style="left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%" aria-label="${got?esc(s.label):"눌러서 확인"}"></button>`;
      }).join("")}
      ${dark?`<div class="torch" id="torch"></div>`:""}
    </div>
    <div class="chips">
      ${st.spots.map(s=>{
        const got = S.got.includes(s.id);
        return `<span class="chip${got?" on":""}">${got?"✓ "+esc(s.label):"? 아직"}</span>`;
      }).join("")}
    </div>`,
    `<button class="btn sub" id="hint" style="margin-top:14px">힌트 보기 (−10점)</button>`);
  afterHud();
  const scene = document.getElementById("scene");

  if (dark) {
    const torch = document.getElementById("torch");
    const move = e => {
      const r = scene.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      torch.style.setProperty("--mx", ((p.clientX-r.left)/r.width*100)+"%");
      torch.style.setProperty("--my", ((p.clientY-r.top)/r.height*100)+"%");
    };
    scene.addEventListener("pointermove", move);
    scene.addEventListener("touchmove", e=>{ move(e); }, {passive:true});
  }

  scene.querySelectorAll(".hot").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.id;
    if (S.got.includes(id)) return;
    const s = st.spots.find(x=>x.id===id);
    S.got.push(id); S.score += 20; sfx("ok"); toast(`${s.label} 찾았어요! +20점`);
    if (S.got.length === all) setTimeout(clearStage, 700);
    else draw();
  });
  scene.onclick = e => {
    if (e.target.closest(".hot")) return;
    const r = scene.getBoundingClientRect();
    const m = document.createElement("div");
    m.className = "miss"; m.textContent = "✕";
    m.style.left = (e.clientX-r.left)+"px"; m.style.top = (e.clientY-r.top)+"px";
    scene.appendChild(m); setTimeout(()=>m.remove(), 950);
    sfx("no");
  };
  document.getElementById("hint").onclick = () => {
    const left = st.spots.filter(s=>!S.got.includes(s.id));
    if (!left.length) return;
    S.score = Math.max(0, S.score-10);
    const pick = left[Math.floor(Math.random()*left.length)];
    const el = scene.querySelector(`[data-id="${pick.id}"]`);
    el.classList.add("hint"); sfx("tap");
    setTimeout(()=>el.classList.remove("hint"), 3000);
    document.querySelector(".hud-sc .pill").textContent = S.score + "점";
  };
}

      ${S.sub>0 ? esc(st.parts[S.sub-1].desc) : "&nbsp;"}</p>
    <div class="pieces">
      ${st.parts.map((p,i)=>`<button class="pc${i===S.sub?" next":""}${i<S.sub?" done":""}" data-i="${i}"
         ${i<S.sub?"disabled":""}>${esc(p.name)}</button>`).join("")}
    </div>`);
  afterHud();
  app.querySelectorAll(".pc").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i);
    if (i !== S.sub) { b.classList.add("shake"); sfx("no"); setTimeout(()=>b.classList.remove("shake"),400);
      return toast("반짝이는 조각을 눌러 주세요"); }
    S.sub++; S.score += 20; sfx("ok");
    if (S.sub >= st.parts.length) { draw(); setTimeout(clearStage, 1100); }
    else draw();
  });
}

/* 7 태극기 게양 */
function viewRaise(){
  const st = cur();
  const pct = Math.min(100, S.sub * 20);
  const up = pct >= 100;
  app.innerHTML = shell(st, `
    <div class="pole">
      <img class="pole-bg" src="${esc(st.img)}" alt="" />
      <div class="pole-stick"></div><div class="pole-top"></div>
      <div class="pole-flag${up?" up":""}" id="flag" style="bottom:calc(8% + ${pct*0.72}%)">${flagSvg(["taegeuk","geon","gam","ri","gon"], false)}</div>
    </div>
    <p style="margin:14px 0 0;text-align:center;font-size:17px;font-weight:800;color:var(--amber)">
      ${up ? "태극기가 다 올라갔어요!" : `조금만 더! ${pct}%`}</p>`,
    `<div style="flex:1;min-height:12px"></div>
     <button class="btn" id="pull">${up ? "만세! →" : "줄 당기기 ⬆"}</button>`);
  afterHud();
  document.getElementById("pull").onclick = () => {
    if (up) { sfx("win"); return clearStage(); }
    S.sub++; S.score += 10; sfx("up"); draw();
  };
}

/* ---------- 스테이지 종료 ---------- */
function clearStage(){
  const st = cur();
  if (!S.badges.includes(st.badge)) S.badges.push(st.badge);
  sfx("win");
  const after = st.after ? `<div class="pic" style="margin-bottom:14px"><img src="${st.after}" alt=""></div>` : "";
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="sheet-in">
    ${after}
    <div class="badge-pop"><i>${st.icon}</i><div><h3>${esc(st.win)}</h3>
      <div style="color:var(--amber);font-size:14px;font-weight:800">‘${esc(st.badge)}’ 배지를 얻었어요</div></div></div>
    <div class="rule"><i>✓</i><p>${esc(st.rule)}</p></div>
    <button class="btn" id="sheet-ok">${S.idx < ST.length-1 ? "다음으로 →" : "끝내기 →"}</button>
  </div>`;
  document.body.appendChild(el);
  el.querySelector("#sheet-ok").onclick = () => {
    el.remove(); sfx("tap");
    if (S.idx < ST.length-1) { S.idx++; S.view="story"; S.got=[]; S.sub=0; }
    else S.view = "end";
    draw();
  };
}

function gameOver(){
  sfx("no");
  sheet({ title:"다시 해 볼까요?", lead:"하트를 모두 썼어요. 이 단계를 처음부터 다시 해요.",
    btn:"다시 하기", cb(){ S.hearts = 3; S.got = []; S.sub = 0; delete cur()._mix; draw(); } });
}

/* ---------- 엔딩 ---------- */
function viewEnd(){
  /* 만점 500점 — 찾기100·우리말60·선택50·손전등60·순서80·그리기100·게양50 */
  const g = S.score >= 460 ? "S" : S.score >= 380 ? "A" : S.score >= 290 ? "B" : "C";
  app.innerHTML = `<div class="wrap end">
    <div class="pic" style="margin-bottom:16px"><img src="${IMG}scene-today.jpg" alt="" /></div>
    <div class="grade">${g}</div>
    <h2>우리는 나라를<br>되찾았습니다</h2>
    <p class="sub">1945년 8월 15일, 우리나라는 빼앗겼던 나라를 되찾았어요.<br>
      <b style="color:var(--amber)">광복</b>은 “빛을 되찾다”라는 뜻이에요.<br>그래서 이날을 <b style="color:var(--amber)">광복절</b>이라고 불러요.</p>
    <div class="stats">
      <div><span>점수</span><b>${S.score}</b></div>
      <div><span>남은 하트</span><b>${S.hearts}</b></div>
      <div><span>배지</span><b>${S.badges.length}/${ST.length}</b></div>
    </div>
    <div class="badges">
      ${ST.map(s=>`<div class="bd${S.badges.includes(s.badge)?"":" off"}"><i>${s.icon}</i><b>${esc(s.badge)}</b></div>`).join("")}
    </div>
    <p style="margin:0 0 6px;font-size:15px;font-weight:800">이름을 쓰면 상장을 받을 수 있어요</p>
    <div class="namerow">
      <input id="nm" maxlength="12" placeholder="이름" value="${esc(S.name)}" />
      <button class="btn" id="cert">상장 받기</button>
    </div>
    <div class="row">
      <button class="btn sub" id="again">다시 하기 ↻</button>
      <button class="btn sub" id="home">처음으로</button>
    </div>
    <a class="credit" style="align-self:center" href="https://www.instagram.com/kimju.zip/" target="_blank" rel="noreferrer">만든이 · kimju.zip</a>
  </div>`;
  music("joy");
  document.getElementById("cert").onclick = makeCert;
  document.getElementById("again").onclick = () => { S.idx=0; S.hearts=3; S.score=0; S.badges=[]; S.got=[]; S.sub=0; ST.forEach(s=>delete s._mix); S.view="story"; draw(); };
  document.getElementById("home").onclick = () => { S.view="cover"; draw(); };
}

/* 상장 PNG */
function makeCert(){
  const nm = (document.getElementById("nm").value || "").trim();
  if (!nm) { toast("이름을 먼저 써 주세요"); return; }
  S.name = nm;
  const W = 900, H = 640, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#FFFDF6"; x.fillRect(0,0,W,H);
  x.strokeStyle = "#CD2E3A"; x.lineWidth = 8;  x.strokeRect(20,20,W-40,H-40);
  x.strokeStyle = "#0047A0"; x.lineWidth = 2;  x.strokeRect(34,34,W-68,H-68);
  const F = (s,w)=>`${w||700} ${s}px "Pretendard Variable",Pretendard,sans-serif`;
  x.textAlign = "center"; x.fillStyle = "#1B2540";
  x.font = F(42,800); x.fillText("광복절 태극기 지킴이", W/2, 118);
  x.font = F(19,600); x.fillStyle = "#6B7695"; x.fillText("8월 15일 광복절 기념", W/2, 152);
  x.font = F(58,800); x.fillStyle = "#CD2E3A"; x.fillText(nm, W/2, 246);
  x.font = F(21,600); x.fillStyle = "#1B2540";
  ["위 어린이는 빼앗긴 우리 것을 모두 되찾고,","태극기를 바르게 그려 높이 올렸으므로","이 상장을 드립니다."].forEach((t,i)=>x.fillText(t, W/2, 312+i*36));
  x.font = F(20,700); x.fillStyle = "#0047A0";
  x.fillText(`점수 ${S.score}점 · 배지 ${S.badges.length}개`, W/2, 452);
  /* 태극 */
  const cx = W/2, cy = 536, r = 34;
  x.save();
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fillStyle="#0047A0"; x.fill();
  x.beginPath();
  x.arc(cx,cy,r,Math.PI,0,false);
  x.arc(cx+r/2,cy,r/2,0,Math.PI,true);
  x.arc(cx-r/2,cy,r/2,0,Math.PI,false);
  x.closePath(); x.fillStyle="#CD2E3A"; x.fill();
  x.restore();
  x.font = F(16,600); x.fillStyle="#8A93AD"; x.fillText("kimju.zip", W/2, H-46);
  const a = document.createElement("a");
  a.download = `광복절_태극기지킴이_${nm}.png`;
  a.href = c.toDataURL("image/png");
  a.click();
  sfx("win"); toast("상장을 저장했어요!");
}

draw();
</script>
</body>
</html>
