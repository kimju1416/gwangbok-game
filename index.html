<style>
:root{
  --bg:#0d1b2a; --panel:#132a3f; --line:rgba(255,255,255,.14);

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  word-break:keep-all; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer}
.hide{display:none !important}

.intro{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,5vw,64px);overflow:hidden}
.intro-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.intro::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(9,20,32,.95) 32%,rgba(9,20,32,.62) 66%,rgba(9,20,32,.25))}
.kicker{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.2em}
.intro h1{margin:12px 0 18px;font-size:clamp(42px,7.4vw,78px);line-height:1.05;letter-spacing:-.045em}
.intro p.lead{margin:0 0 26px;color:rgba(255,255,255,.86);font-size:clamp(16px,1.7vw,19px);line-height:1.8}
.hero-pick-label{color:var(--mint);font-size:13px;font-weight:800;letter-spacing:.1em;margin-bottom:9px}
.hero-pick{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px}
.hero-choice{width:86px;padding:7px 5px 9px;border:1px solid var(--line);border-radius:14px;background:rgba(14,34,52,.76);color:var(--muted);font-size:13px;font-weight:700;text-align:center;transition:160ms}
.hero-choice img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 22%;border-radius:10px;margin-bottom:5px;display:block}
.hero-choice[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:rgba(240,180,41,.16);box-shadow:0 0 0 1px var(--gold)}
.start-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:16px 28px;font-size:17px;font-weight:800;transition:160ms}
.btn-main{background:linear-gradient(120deg,#ffd166,#f0a429);color:#3a2405;box-shadow:0 14px 30px rgba(240,164,41,.32)}
.btn-main:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.09);color:var(--ink);border:1px solid var(--line)}
.facts{display:flex;gap:18px;color:var(--muted);font-size:13px}
.facts b{display:block;color:var(--ink);font-size:21px}
.intro-msg{position:absolute;right:clamp(16px,3vw,44px);bottom:clamp(60px,9vh,110px);width:min(330px,46vw);display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:rgba(11,26,40,.86);backdrop-filter:blur(9px)}
.intro-msg img{width:52px;height:52px;border-radius:12px;object-fit:cover;object-position:center 20%;flex:0 0 auto}
.intro-msg b{display:block;color:var(--gold);font-size:13px;margin-bottom:3px}
.intro-msg p{margin:0;font-size:14px;line-height:1.6;color:rgba(255,255,255,.88)}
.best{margin-top:16px;color:var(--gold);font-size:14px}

.credit{display:inline-flex;align-items:center;gap:6px;margin-top:20px;color:rgba(255,255,255,.42);font-size:12px;font-weight:500;text-decoration:none;transition:160ms}
.credit:hover{color:rgba(255,255,255,.86)}
.ig{position:relative;width:13px;height:13px;border:1.5px solid currentColor;border-radius:4px;flex:0 0 auto}
.ig::before{content:"";position:absolute;top:50%;left:50%;width:4px;height:4px;border:1.5px solid currentColor;border-radius:50%;transform:translate(-50%,-50%)}
.ig::after{content:"";position:absolute;top:1px;right:1px;width:2px;height:2px;border-radius:50%;background:currentColor}

/* ---------- 상단 바 ---------- */
.hud{height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(12px,2vw,24px);border-bottom:1px solid var(--line);background:rgba(10,24,38,.92);position:sticky;top:0;z-index:20}
.hud-left{display:flex;align-items:center;gap:10px;min-width:0}
.hud-left img{width:38px;height:38px;border-radius:11px;object-fit:cover;object-position:center 20%}
.hud-title{font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;gap:5px}
.step i{width:23px;height:23px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px}
.step.on i{background:var(--gold);color:#3a2405;border-color:transparent;font-weight:800}
.step.done i{background:var(--mint);color:#04302a;border-color:transparent}
.hud-right{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.06);color:var(--ink);font-size:14px;font-weight:700}

/* ---------- 미션 화면 ---------- */
.mission{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,380px);height:calc(100svh - 64px);min-height:560px}
.scene-col{display:flex;flex-direction:column;min-width:0;padding:clamp(12px,1.5vw,22px) clamp(14px,2.4vw,32px)}
.scene-head{margin-bottom:12px}
.scene-head span{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.18em}
.scene-head h2{margin:5px 0 0;font-size:clamp(21px,2.1vw,33px);letter-spacing:-.04em}

/* 배경이 잘리지 않게 원본 비율로 고정된 무대.
   절대 object-fit:cover 로 바꾸지 말 것. */
.scene-frame{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:18px;background:#0b2033;overflow:hidden;box-shadow:var(--shadow);container-type:size}
.scene-stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(100cqw, calc(100cqh * var(--stage-aspect)));
  height:min(100cqh, calc(100cqw / (var(--stage-aspect))));
  aspect-ratio:var(--stage-aspect);overflow:hidden}
.scene-stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.scene-stage>img.after-layer{opacity:0;transition:opacity 1.5s ease}
.scene-stage.revealed>img.after-layer{opacity:1}

.hotspot{position:absolute;z-index:4;border:0;border-radius:12px;background:transparent;padding:0;display:grid;place-items:center;color:transparent}
.hotspot::after{content:"";position:absolute;inset:0;border-radius:12px;border:2px dashed transparent;transition:160ms}
.hotspot:hover::after,.hotspot:focus-visible::after{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.08)}
.hotspot>span{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#3a2405;background:transparent;opacity:0;transition:160ms}
.hotspot:hover>span,.hotspot:focus-visible>span{opacity:1;background:rgba(255,255,255,.92)}
.hotspot.hinted::after{border-color:var(--gold);animation:pulse 1.1s ease-in-out 3}
.hotspot.found::after{border:2px solid var(--gold);background:rgba(240,180,41,.2)}
.hotspot.found>span{opacity:1;background:var(--gold)}
.hotspot.found>b{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);padding:4px 9px;border-radius:999px;background:var(--gold);color:#3a2405;font-size:12px;font-weight:800;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(240,180,41,.22)}}

/* ---------- 오른쪽 패널 ---------- */
.panel{border-left:1px solid var(--line);background:var(--panel);padding:clamp(18px,2.4vw,30px);overflow-y:auto}
.panel-msg{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:18px}
.panel-msg img{width:48px;height:48px;border-radius:11px;object-fit:cover;object-position:center 20%;flex:0 0 auto}
.panel-msg b{display:block;color:var(--gold);font-size:13px;margin-bottom:2px}
.panel-msg p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-top span{color:var(--mint);font-size:12px;font-weight:800;letter-spacing:.12em}
.panel-top strong{display:block;font-size:36px;line-height:1.1}
.panel-top strong small{font-size:15px;color:var(--muted)}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.ring i{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-style:normal}
.found-list{display:grid;gap:8px}
.found-item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.04)}
.found-item>i{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:14px;background:rgba(255,255,255,.07);color:var(--muted);flex:0 0 auto}
.found-item b{display:block;font-size:14px;margin-bottom:3px}
.found-item small{display:block;font-size:13px;line-height:1.6;color:var(--muted)}
.found-item.on{border-color:rgba(240,180,41,.5);background:rgba(240,180,41,.1)}
.found-item.on>i{background:var(--gold);color:#3a2405}
.hint-btn{width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.06);color:var(--ink);font-size:15px;font-weight:700}
.hint-btn b{color:var(--gold);font-size:13px}

/* ---------- 되찾음 연출 ---------- */
.reveal{position:relative;min-height:calc(100svh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:clamp(18px,3vw,40px)}
.reveal-stage{width:min(1000px,100%);aspect-ratio:var(--stage-aspect);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);position:relative;background:#0b2033}
.reveal-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.reveal-stage img.b{animation:swap 1.6s ease forwards}
@keyframes swap{0%{opacity:1}100%{opacity:0}}
.reveal-text{text-align:center;max-width:640px}
.reveal-text h2{margin:0 0 10px;font-size:clamp(28px,4vw,44px);letter-spacing:-.04em;color:var(--gold)}
.reveal-text p{margin:0;font-size:clamp(16px,1.8vw,19px);line-height:1.8;color:rgba(255,255,255,.9)}

/* ---------- 이야기(그림책) ---------- */
.story{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.6vh,26px);padding:clamp(16px,3vw,38px)}
.story-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(26px) brightness(.4);z-index:-1;transform:scale(1.1)}
/* 텍스트 카드와 버튼이 늘 화면 안에 남도록 그림 너비를 높이 기준으로도 제한한다.
   (aspect-ratio에 max-height를 함께 걸면 비율이 깨지므로 width만 계산한다) */
.story-pic{width:min(940px,100%,calc((100svh - 360px) * var(--stage-aspect)));aspect-ratio:var(--stage-aspect);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#0b2033;flex:0 0 auto}
.story-pic img{width:100%;height:100%;object-fit:fill;display:block;animation:kenburns 14s ease-out both}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.05)}}
.story-text{width:min(940px,100%);padding:clamp(18px,2.6vw,28px) clamp(20px,3vw,34px);border:1px solid var(--line);border-radius:20px;background:rgba(12,29,45,.92);box-shadow:var(--shadow)}
.story-text p{margin:0 0 10px;font-size:clamp(19px,2.3vw,27px);line-height:1.75;letter-spacing:-.02em;color:rgba(255,255,255,.82);transition:color .3s ease}
.story-text p:last-child{margin-bottom:0}
.story-text p.speaking{color:var(--gold)}
.story-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.story-page{color:var(--muted);font-size:14px;font-weight:700}
.btn-listen{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:14px 20px;background:rgba(255,255,255,.08);color:var(--ink);font-size:16px;font-weight:700}
.btn-listen.on{border-color:var(--gold);color:var(--gold)}

/* ---------- 퀴즈 ---------- */
.quiz{position:relative;min-height:calc(100svh - 64px);display:grid;place-items:center;padding:24px;overflow:hidden}
.quiz-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(14px) brightness(.38);z-index:-1}
.quiz-card{width:min(640px,100%);padding:clamp(24px,4vw,42px);border:1px solid var(--line);border-radius:22px;background:rgba(12,29,45,.94);box-shadow:var(--shadow);text-align:center}
.quiz-card span.no{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.18em}
.quiz-card h3{margin:14px 0 26px;font-size:clamp(21px,2.4vw,28px);line-height:1.55;letter-spacing:-.03em}
.ox{display:flex;gap:14px;justify-content:center}
.ox button{width:120px;height:96px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-size:38px;font-weight:800;transition:160ms}
.ox button:hover{transform:translateY(-3px);border-color:var(--gold)}
.quiz-feed{margin-top:20px;padding:16px;border-radius:14px;font-size:16px;line-height:1.7}
.quiz-feed.ok{background:rgba(95,211,174,.15);color:#cbf5e7}
.quiz-feed.no{background:rgba(232,80,58,.15);color:#ffd7d0}

/* ---------- 태극기 맞추기 ---------- */
.finale{position:relative;min-height:calc(100svh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vh,26px);padding:clamp(18px,3vw,40px);overflow:hidden}
.finale-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.34);z-index:-1}
.finale h2{margin:0;font-size:clamp(24px,3.4vw,38px);letter-spacing:-.04em;text-align:center}
.finale > p{margin:0;color:var(--muted);font-size:16px;text-align:center}
.flag-wrap{width:min(560px,88vw);aspect-ratio:3/2;border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.flag-wrap svg{width:100%;height:100%;display:block}
.flag-part{opacity:0;transform-origin:150px 100px;transition:opacity .5s ease}
.flag-part.on{opacity:1;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pieces{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.piece{padding:13px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.09);color:var(--ink);font-size:17px;font-weight:800;transition:160ms}
.piece:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold);background:rgba(240,180,41,.2)}
.piece:disabled{opacity:.3;cursor:default}
.piece.next{border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,180,41,.4)}
.piece-desc{min-height:26px;color:var(--gold);font-size:16px;font-weight:700;text-align:center}

/* ---------- 결과 ---------- */
.final{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:clamp(22px,5vw,64px);overflow:hidden}
.final-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.final::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(9,20,32,.95) 34%,rgba(9,20,32,.6) 70%,rgba(9,20,32,.2))}
.final h1{margin:14px 0 16px;font-size:clamp(34px,5.6vw,58px);line-height:1.12;letter-spacing:-.045em}
.final>p{margin:0;max-width:600px;color:rgba(255,255,255,.88);font-size:17px;line-height:1.85}
.final>p b{color:var(--gold)}
.board{width:min(580px,100%);margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;background:rgba(12,29,45,.76);overflow:hidden}
.board>div{padding:16px 18px}
.board>div:not(:last-child){border-right:1px solid var(--line)}
.board span{display:block;color:var(--muted);font-size:13px}
.board strong{display:block;margin-top:5px;font-size:26px}
.board strong small{font-size:13px;color:var(--muted)}
.badges{margin-top:22px}
.badges>span{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.18em}
.badges>b{display:block;margin:5px 0 12px;font-size:18px}
.badge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(680px,100%)}
.badge-card{display:flex;gap:9px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.05)}
.badge-card>i{width:27px;height:27px;border-radius:8px;background:rgba(240,180,41,.2);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:14px;flex:0 0 auto}
.badge-card b{display:block;font-size:13px}
.badge-card small{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.final-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

/* ---------- 토스트 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;padding:14px 22px;border-radius:14px;background:rgba(10,26,40,.96);border:1px solid var(--line);box-shadow:var(--shadow);font-size:15px;font-weight:700;max-width:88vw;text-align:center}
.toast.ok{border-color:rgba(240,180,41,.55);color:#ffe6ab}

/* ---------- 좌표 도우미 (?debug=1) ---------- */
.debug .hotspot::after{border:2px solid #ff2d55 !important;background:rgba(255,45,85,.1)}
.debug .hotspot>span{opacity:1;background:rgba(255,255,255,.85)}
.dbg-box{position:absolute;border:2px solid #ffd400;background:rgba(255,212,0,.16);z-index:9;pointer-events:none}
.dbg-out{position:fixed;left:12px;bottom:12px;z-index:80;max-width:min(520px,92vw);padding:12px 14px;border-radius:12px;background:rgba(4,16,28,.95);border:1px solid #ffd400;color:#ffe98a;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}

/* ---------- 모바일 ---------- */
@media (max-width:900px){
  .mission{grid-template-columns:1fr;height:auto}
  .scene-frame{flex:none;aspect-ratio:var(--stage-aspect);height:auto;min-height:0}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .found-list{grid-template-columns:repeat(2,1fr);display:grid}
  .badge-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .intro-msg{position:static;width:auto;margin-top:22px}
  .reveal{min-height:auto;padding-bottom:36px}
}
@media (max-width:680px){
  .steps{display:none}
  .scene-col{padding:12px 14px}
  .scene-frame{margin:0 -14px;width:calc(100% + 28px);border-radius:0;border-left:0;border-right:0}
  .found-list{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .board>div:not(:last-child){border-right:0;border-bottom:1px solid var(--line)}
  .badge-grid{grid-template-columns:1fr}
  .hero-choice{width:calc(33.33% - 6px)}
  .piece{padding:11px 14px;font-size:15px}
}
</style>

<body>
<div id="app"></div>

<script>
/* ============================================================
   게임 엔진
   ============================================================ */
const DEBUG = new URLSearchParams(location.search).has("debug");
const app = document.getElementById("app");
const LS_BEST = "gwangbok-best";
const LS_SET  = "gwangbok-settings";

document.documentElement.style.setProperty("--stage-aspect", CONFIG.aspect);
document.title = CONFIG.title;

const S = {
  phase: "intro",        // intro | story | scene | reveal | quiz | finale | final
  storyKey: "pro",       // "pro" | 0..n | "epi"
  storyPage: 0,
  sceneIdx: 0,
  quizIdx: 0,
  found: {},
  score: 0,
  hints: 5,
  elapsed: 0,
  heroId: CONFIG.heroes[0].id,
  soundOn: true,
  timer: null,
  hinted: null,
  finaleStep: 0,
};
CONFIG.scenes.forEach(s => S.found[s.id] = []);

const hero = () => CONFIG.heroes.find(h => h.id === S.heroId) || CONFIG.heroes[0];
const scene = () => CONFIG.scenes[S.sceneIdx];
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

/* ---------- 저장 ---------- */
function loadSaved(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_SET) || "{}");
    if (s.heroId && CONFIG.heroes.some(h => h.id === s.heroId)) S.heroId = s.heroId;
    if (typeof s.soundOn === "boolean") S.soundOn = s.soundOn;
  }catch{}
}
function saveSet(){ localStorage.setItem(LS_SET, JSON.stringify({ heroId:S.heroId, soundOn:S.soundOn })); }
function best(){ try{ return JSON.parse(localStorage.getItem(LS_BEST) || "null"); }catch{ return null; } }
function saveBest(rec){
  const b = best();
  if (!b || rec.score > b.score || (rec.score === b.score && rec.time < b.time))
    localStorage.setItem(LS_BEST, JSON.stringify(rec));
}

/* ---------- 소리 ---------- */
let actx = null, bgm = null, bgmKey = null, fadeT = null;
const MUSIC_VOL = 0.4;
function ctx(){
  if (!S.soundOn) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  actx = actx || new AC();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(kind){
  const c = ctx(); if (!c) return;
  const spec = { find:[660,880,0.16], wrong:[200,150,0.2], click:[520,520,0.06], win:[523,1046,0.5] }[kind] || [440,440,0.1];
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = kind === "wrong" ? "sawtooth" : "sine";
  o.frequency.setValueAtTime(spec[0], t);
  o.frequency.exponentialRampToValueAtTime(spec[1], t + spec[2]);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(kind === "wrong" ? .06 : .1, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + spec[2]);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + spec[2] + .05);
}
function fadeTo(target, done){
  if (!bgm) return;
  clearInterval(fadeT);
  fadeT = setInterval(() => {
    const v = bgm.volume;
    const next = v < target ? Math.min(target, v + .05) : Math.max(target, v - .05);
    bgm.volume = next;
    if (Math.abs(next - target) < .001) { clearInterval(fadeT); done && done(); }
  }, 40);
}
function playBgm(key){
  if (!S.soundOn || !CONFIG.audio[key]) return stopBgm();
  if (!bgm) { bgm = new Audio(); bgm.loop = true; bgm.preload = "auto"; bgm.volume = 0; }
  if (bgmKey === key && !bgm.paused) return fadeTo(MUSIC_VOL);
  clearInterval(fadeT);
  bgm.pause(); bgm.src = CONFIG.audio[key]; bgm.currentTime = 0; bgm.volume = 0; bgmKey = key;
  bgm.play().then(() => fadeTo(MUSIC_VOL)).catch(() => { bgmKey = null; });
}
function stopBgm(){ clearInterval(fadeT); bgmKey = null; if (bgm) { bgm.pause(); bgm.volume = 0; } }

/* ---------- 이야기 읽어주기 ----------
   voice에 mp3가 있으면 그 파일(성우 녹음)을 재생하고,
   없거나 재생에 실패하면 브라우저 음성으로 대신 읽는다. */
let narr = null, narrAudio = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
  if (!vs.length) return null;
  /* 신경망 음성(자연스러움)을 먼저 고른다 */
  const score = v => (/natural|neural|online|wavenet/i.test(v.name) ? 4 : 0)
                   + (/sunhi|injoon|heami|서현|선히/i.test(v.name) ? 2 : 0)
                   + (v.localService ? 0 : 1);
  return vs.sort((a,b) => score(b) - score(a))[0];
}
function stopNarration(){
  if (narrAudio) { narrAudio.pause(); narrAudio = null; }
  try { speechSynthesis.cancel(); } catch {}
  narr = null;
  document.querySelectorAll(".story-text p.speaking").forEach(p => p.classList.remove("speaking"));
  const b = document.getElementById("listen");
  if (b) { b.classList.remove("on"); b.querySelector("span").textContent = "다시 들려주기"; }
}
function narrate(page){
  stopNarration();
  const btn = document.getElementById("listen");
  const mark = i => {
    document.querySelectorAll(".story-text p").forEach((p, n) => p.classList.toggle("speaking", n === i));
  };
  const done = () => { mark(-1); if (btn) { btn.classList.remove("on"); btn.querySelector("span").textContent = "다시 들려주기"; } };
  if (btn) { btn.classList.add("on"); btn.querySelector("span").textContent = "읽는 중…"; }

  /* 1순위 — 녹음된 음성 파일 */
  if (CONFIG.voiceReady && page.voice) {
    const a = new Audio(page.voice);
    narrAudio = a;
    a.onended = () => { narrAudio = null; done(); };
    a.onerror = () => { narrAudio = null; speak(); };
    mark(0);
    a.play().catch(() => { narrAudio = null; speak(); });
    return;
  }
  speak();

  /* 2순위 — 브라우저 음성 */
  function speak(){
    if (!("speechSynthesis" in window)) return done();
    const v = pickVoice();
    narr = page;
    page.lines.forEach((line, i) => {
      const u = new SpeechSynthesisUtterance(line);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "ko-KR";
      u.rate = 0.88; u.pitch = 1.02; u.volume = 1;
      u.onstart = () => { if (narr === page) mark(i); };
      if (i === page.lines.length - 1) u.onend = () => { if (narr === page) done(); };
      speechSynthesis.speak(u);
    });
  }
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- 태극기 SVG ---------- */
/* 괘 하나를 그린다. broken = 가운데가 끊긴 효(음)의 위치 배열 */
function trigram(broken){
  const L = 46, T = 7.5, GAP = 5.5, HALF = (L - 8) / 2;
  let out = "";
  [0, 1, 2].forEach(i => {
    const y = (i - 1) * (T + GAP) - T / 2;
    if (broken.includes(i)) {
      out += `<rect x="${-L/2}" y="${y}" width="${HALF}" height="${T}" />`;
      out += `<rect x="${L/2 - HALF}" y="${y}" width="${HALF}" height="${T}" />`;
    } else {
      out += `<rect x="${-L/2}" y="${y}" width="${L}" height="${T}" />`;
    }
  });
  return out;
}
/* 표준 배치 — 좌상 건(하늘), 우상 감(물), 좌하 리(불), 우하 곤(땅) */
const TRIGRAMS = {
  geon: { broken: [],        x: 75,  y: 50,  rot: -56.31 },
  gam:  { broken: [0, 2],    x: 225, y: 50,  rot:  56.31 },
  ri:   { broken: [1],       x: 75,  y: 150, rot:  56.31 },
  gon:  { broken: [0, 1, 2], x: 225, y: 150, rot: -56.31 },
};
function flagSvg(done){
  const on = id => done.includes(id) ? "flag-part on" : "flag-part";
  /* 바깥 <g>는 애니메이션(scale)용, 안쪽 <g>는 위치·회전용 — 한 요소에 같이 두면
     CSS transform이 SVG transform 속성을 덮어써서 괘가 전부 좌상단으로 몰린다. */
  const g = Object.entries(TRIGRAMS).map(([id, t]) =>
    `<g class="${on(id)}" fill="#000"><g transform="translate(${t.x},${t.y}) rotate(${t.rot})">${trigram(t.broken)}</g></g>`
  ).join("");
  return `<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="태극기">
    <rect width="300" height="200" fill="#fff"/>
    <g class="${on("taegeuk")}">
      <circle cx="150" cy="100" r="50" fill="#0047a0"/>
      <path d="M100,100 A50,50 0 0,1 200,100 A25,25 0 0,0 150,100 A25,25 0 0,1 100,100 Z" fill="#cd2e3a"/>
    </g>
    ${g}
  </svg>`;
}

function findHazard(id){
  const sc = scene(), got = S.found[sc.id];
  if (got.includes(id)) return;
  const hz = sc.hazards.find(h => h.id === id);
  got.push(id);
  S.score += 10;
  S.hinted = null;
  tone("find");
  toast(`${hz.label} 찾았어요! +10점`, true);
  if (got.length === sc.hazards.length) {
    setTimeout(() => { S.phase = "reveal"; render(); }, 1000);
  }
  render();
}

function useHint(){
  const sc = scene(), left = sc.hazards.filter(h => !S.found[sc.id].includes(h.id));
  if (!left.length) return;
  if (S.hints <= 0) return toast("힌트를 모두 썼어요");
  S.hints--; S.score = Math.max(0, S.score - 3);
  S.hinted = left[Math.floor(Math.random() * left.length)].id;
  tone("click"); render();
  setTimeout(() => { S.hinted = null; if (S.phase === "scene") render(); }, 3400);
}

/* ---------- 좌표 도우미 (?debug=1) ---------- */
function enableCoordPicker(){
  const stage = document.getElementById("stage");
  if (!stage) return;
  let box = null, sx = 0, sy = 0;
  const pct = e => {
    const r = stage.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*100, y:(e.clientY-r.top)/r.height*100 };
  };
  stage.addEventListener("pointerdown", e => {
    if (e.target.closest(".hotspot")) return;
    const p = pct(e); sx = p.x; sy = p.y;
    box = document.createElement("div"); box.className = "dbg-box";
    stage.appendChild(box); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if (!box) return;
    const p = pct(e);
    Object.assign(box.style, {
      left:Math.min(sx,p.x)+"%", top:Math.min(sy,p.y)+"%",
      width:Math.abs(p.x-sx)+"%", height:Math.abs(p.y-sy)+"%",
    });
  });
  stage.addEventListener("pointerup", e => {
    if (!box) return;
    const p = pct(e);
    const o = { x:Math.round(Math.min(sx,p.x)), y:Math.round(Math.min(sy,p.y)),
                w:Math.round(Math.abs(p.x-sx)), h:Math.round(Math.abs(p.y-sy)) };
    const line = `{ id: "", label: "", x: ${o.x}, y: ${o.y}, w: ${o.w}, h: ${o.h}, lesson: "" },`;
    let out = document.querySelector(".dbg-out");
    if (!out) { out = document.createElement("div"); out.className = "dbg-out"; document.body.appendChild(out); }
    const warn = (o.w < 12 || o.h < 12) ? "\n⚠ w·h가 12보다 작으면 모바일에서 누르기 어렵다" : "";
    out.textContent = line + warn;
    console.log(line);
    setTimeout(() => box && box.remove(), 1200);
    box = null;
  });
}

loadSaved();
render();
</script>
</body>
</html>
