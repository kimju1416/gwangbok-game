<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>영이의 광복절</title>
<meta property="og:title" content="영이의 광복절 — 8월 15일" />
<meta property="og:description" content="1910년부터 1945년까지, 35년의 이야기. 초등 저학년 광복절 역사 학습." />
<meta property="og:image" content="assets/og.jpg" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --pt:#E8503A; --pt-dk:#B23726;
  --amber:#F0B429; --amber-dk:#C08A12; --blue:#2B64C4;
  --bg:#131A2E; --bg2:#1A2340; --card:#20294A; --bd:#33406B;
  --tx:#F2EFE6; --tx2:#9AA5C7;
  --ok:#3ECF8E; --ok-bg:rgba(62,207,142,.14);
  --err:#FF5D5D; --err-bg:rgba(255,93,93,.15);
  --r-s:12px; --r-c:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
img{display:block;max-width:100%}
#app{min-height:100svh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:14px 16px 32px;flex:1;display:flex;flex-direction:column}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 18px;
  border-radius:var(--r-s);background:var(--amber);color:#2A1B02;font-size:18px;font-weight:800;line-height:1.35;
  box-shadow:0 4px 0 var(--amber-dk);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--amber-dk)}
.btn.sub{background:var(--card);border:1px solid var(--bd);color:var(--tx);box-shadow:0 4px 0 #141A30}
.btn:disabled{opacity:.45;box-shadow:none;transform:none}
.row{display:flex;gap:10px}
.row>.btn{flex:1 1 0;min-width:0}

/* HUD */
.hud{position:sticky;top:0;z-index:30;background:rgba(15,22,40,.97);border-bottom:1px solid var(--bd)}
.hud-in{max-width:720px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:9px}
.pill{height:32px;padding:0 11px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);
  border-radius:9px;background:var(--bg2);font-size:14px;font-weight:800;white-space:nowrap}
.pill.year{background:var(--pt);border-color:var(--pt);color:#fff}
.hud-r{margin-left:auto;display:flex;gap:7px}
.pbar{height:5px;background:var(--bg2)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pt),var(--amber));transition:width .4s}

/* 표지 */
.cover{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:100svh}
.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 세로 화면에서는 세로 표지를 쓰고, 그림은 위쪽 2/3에만 둔다.
   그림을 화면 전체에 깔면 아래쪽 인물과 태극기가 글자에 가려진다. */
.cover-bg.tall{display:none}
.cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(19,26,46,.12) 0%,rgba(19,26,46,.8) 50%,rgba(19,26,46,.98) 80%)}
/* 이 블록은 반드시 위 .cover::after 규칙 '뒤'에 와야 한다.
   앞에 두면 특정성이 같아 나중에 오는 inset:0 이 이겨서 height가 무시되고,
   그라데이션이 화면 전체에 걸려 인물과 태극기가 어둡게 묻힌다. */
@media (max-aspect-ratio:1/1){
  .cover-bg.tall{display:block;inset:auto;top:0;left:0;height:70%;object-position:center top}
  .cover-bg.wide{display:none}
  .cover::after{top:0;bottom:auto;height:70%;
    background:linear-gradient(180deg,rgba(19,26,46,0) 0%,rgba(19,26,46,0) 76%,rgba(19,26,46,.4) 90%,var(--bg) 100%)}
}
.cover-in{position:relative;z-index:2;width:100%;max-width:720px;margin:0 auto;padding:0 18px 30px;text-align:center}
.tag{display:inline-block;padding:5px 12px;border-radius:99px;background:rgba(232,80,58,.92);color:#fff;
  font-size:13px;font-weight:800;margin-bottom:12px}
.cover h1{margin:0 0 10px;font-size:clamp(38px,10vw,58px);line-height:1.05;letter-spacing:-.045em;
  text-shadow:0 4px 24px rgba(0,0,0,.5)}
.cover p{margin:0 auto 22px;max-width:440px;font-size:17px;line-height:1.75;color:rgba(255,255,255,.9)}
.credit{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:rgba(255,255,255,.42);
  font-size:12px;text-decoration:none}
.credit:hover{color:rgba(255,255,255,.8)}

/* 이야기 */
.pic{border-radius:var(--r-c);overflow:hidden;border:1px solid var(--bd);background:#0E1628;
  box-shadow:0 12px 34px rgba(0,0,0,.4);aspect-ratio:1400/933}
.pic>img{width:100%;height:100%;object-fit:cover}
.tell{margin-top:14px;padding:18px;border:1px solid var(--bd);border-radius:var(--r-c);background:var(--card)}
.tell p{margin:0 0 10px;font-size:clamp(17px,4.4vw,20px);line-height:1.8;font-weight:600;color:rgba(255,255,255,.92)}
.tell p:last-child{margin-bottom:0}
.tell p.on{color:var(--amber)}
.tell em{font-style:normal;color:var(--amber);font-weight:800}
.head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.head i{width:30px;height:30px;border-radius:9px;background:var(--pt);display:grid;place-items:center;
  font-style:normal;font-size:15px;font-weight:800;color:#fff;flex:0 0 auto}
.head b{font-size:15px;font-weight:800;color:var(--amber)}
h2.t{margin:0 0 4px;font-size:clamp(21px,5.4vw,27px);letter-spacing:-.03em;line-height:1.3}
p.ask{margin:6px 0 12px;font-size:15px;color:var(--tx2);line-height:1.6}

/* 연도 */
.years{margin:10px 0;padding:26px 18px;border:1px solid var(--bd);border-radius:var(--r-c);
  background:linear-gradient(160deg,#1B2440,#141B31);text-align:center}
.ynum{font-size:clamp(56px,16vw,92px);font-weight:800;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--amber)}
.ycap{margin-top:10px;font-size:16px;color:var(--tx2);min-height:24px}
.ybar{margin-top:16px;height:10px;border-radius:99px;background:#0E1426;overflow:hidden}
.ybar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pt),var(--amber));transition:width .1s linear}
.ybig{margin-top:16px;font-size:clamp(24px,6vw,32px);font-weight:800;color:#fff;opacity:0;transition:opacity .6s}
.ybig.on{opacity:1}

/* 찾기 */
.scene{position:relative;border-radius:var(--r-c);overflow:hidden;border:1px solid var(--bd);
  background:#0E1628;aspect-ratio:1400/933;cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.hot{position:absolute;background:transparent;padding:0;cursor:inherit;border-radius:12px}
.hot::after{content:"";position:absolute;inset:0;border-radius:12px;border:3px solid transparent;transition:.16s}
.hot.hint::after{border-color:var(--amber);animation:pulse 1s ease-in-out 3}
.hot.got::after{border-color:var(--ok);background:rgba(62,207,142,.22)}
.hot.got::before{content:"✓";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:32px;height:32px;border-radius:50%;background:var(--ok);color:#08281B;font-size:17px;font-weight:800;
  display:grid;place-items:center}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(240,180,41,.2)}}
.miss{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--err);
  color:var(--err);font-size:18px;font-weight:800;display:grid;place-items:center;animation:fade 1s forwards;pointer-events:none}
@keyframes fade{0%{transform:scale(.5);opacity:1}70%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{padding:9px 13px;border:1px solid var(--bd);border-radius:99px;background:var(--bg2);
  font-size:14px;font-weight:700;color:var(--tx2)}
.chip.on{border-color:var(--ok);background:var(--ok-bg);color:var(--tx)}

/* 선택지 */
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:center;border:2px solid var(--bd);border-radius:var(--r-s);
  background:var(--bg2);padding:18px 16px;font-size:20px;font-weight:800;line-height:1.5;
  box-shadow:0 4px 0 #0E1426;transition:transform .06s,box-shadow .06s}
.opt.left{text-align:left;font-size:16px;font-weight:700}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #0E1426}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.no{border-color:var(--err);background:var(--err-bg)}
.opt svg{width:120px;height:80px;margin:0 auto;display:block}
.qnum{margin:12px 0 0;text-align:center;font-size:14px;color:var(--tx2)}

/* 인물 */
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.wcard{border:1px solid var(--bd);border-radius:var(--r-c);background:var(--bg2);overflow:hidden;text-align:left;
  transition:transform .06s}
.wcard img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:sepia(.18)}
.wcard .nm{padding:9px 8px 10px}
.wcard b{display:block;font-size:14px;margin-bottom:2px}
.wcard small{display:block;font-size:11px;color:var(--tx2);line-height:1.4}
.wcard.pickable{cursor:pointer;box-shadow:0 4px 0 #0E1426}
.wcard.pickable:active{transform:translateY(3px);box-shadow:0 1px 0 #0E1426}
.wcard.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.wcard.no{border-color:var(--err);box-shadow:0 0 0 2px var(--err)}
.wdesc{margin-top:12px;padding:16px;border:1px solid var(--bd);border-radius:var(--r-c);background:var(--card)}
.wdesc h4{margin:0 0 4px;font-size:18px}
.wdesc .yr{font-size:13px;color:var(--amber);font-weight:800;margin-bottom:8px}
.wdesc p{margin:0;font-size:16px;line-height:1.75;color:rgba(255,255,255,.9)}

/* 만세 */
.cheer{position:relative;border-radius:var(--r-c);overflow:hidden;border:1px solid var(--bd);
  aspect-ratio:1400/933;cursor:pointer;background:#0E1628}
.cheer>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cheer .veil{position:absolute;inset:0;background:rgba(10,16,32,.28);transition:background .3s}
.fly{position:absolute;width:38px;height:26px;pointer-events:none;animation:fly 1.5s ease-out forwards}
@keyframes fly{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-150px) scale(1.15);opacity:0}}
.mansae{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(30px,9vw,52px);
  font-weight:800;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.7);pointer-events:none;animation:mpop .6s ease}
@keyframes mpop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* 태극기 */
.flagbox{position:relative;border-radius:var(--r-c);overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.45);
  background:#fff;aspect-ratio:3/2;width:100%}
.flagbox svg{width:100%;height:100%;display:block}
.fp{opacity:0;transition:opacity .4s}
.fp.on{opacity:1}
.fp.on>g,.fp.on>circle,.fp.on>path{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.55)}62%{transform:scale(1.1)}100%{transform:scale(1)}}
.slot{position:absolute;border:3px dashed #B9C0D0;border-radius:10px;background:rgba(43,100,196,.05);
  cursor:pointer;transition:.15s}
.slot.armed{border-color:var(--pt);background:rgba(232,80,58,.14);animation:blink 1s infinite}
@keyframes blink{50%{border-color:var(--amber);background:rgba(240,180,41,.2)}}
.slot.filled{display:none}
.slot.bad{animation:shake .4s;border-color:var(--err)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pieces{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pc{min-width:86px;padding:12px 14px;border:2px solid var(--bd);border-radius:var(--r-s);background:var(--bg2);
  font-size:17px;font-weight:800;box-shadow:0 4px 0 #0E1426;transition:transform .06s,box-shadow .06s}
.pc:active{transform:translateY(3px);box-shadow:0 1px 0 #0E1426}
.pc.sel{border-color:var(--amber);box-shadow:0 4px 0 var(--amber-dk),0 0 0 3px rgba(240,180,41,.25)}
.pc.done{opacity:.3;box-shadow:none}
.pcbar{width:34px;height:24px;display:inline-block;vertical-align:middle;margin-right:5px}

/* 게양 */
.pole{position:relative;width:100%;aspect-ratio:3/4;max-height:58svh;margin:0 auto;border-radius:var(--r-c);
  overflow:hidden;border:1px solid var(--bd);touch-action:none;user-select:none}
.pole-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.82)}
.pole-stick{position:absolute;left:26%;top:6%;bottom:4%;width:8px;border-radius:4px;
  background:linear-gradient(90deg,#E4DFD2,#9A9384)}
.pole-top{position:absolute;left:26%;top:4%;width:16px;height:16px;margin-left:-4px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 12px rgba(240,180,41,.7)}
.pole-flag{position:absolute;left:calc(26% + 8px);width:40%;aspect-ratio:3/2;background:#fff;border-radius:2px;
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
.pole-flag svg{width:100%;height:100%;display:block}
.pole-flag.up{animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0) skewY(0)}35%{transform:rotate(-.8deg) skewY(1.3deg)}70%{transform:rotate(.7deg) skewY(-1.1deg)}}
.rope{position:absolute;left:calc(26% - 22px);width:44px;top:8%;bottom:6%;cursor:grab;touch-action:none}
.rope::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;
  background:repeating-linear-gradient(180deg,#EFE7D2 0 8px,#C9BE9E 8px 14px);border-radius:2px}
.grip{position:absolute;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;
  background:var(--amber);border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.5);display:grid;place-items:center;
  font-size:20px;color:#2A1B02;font-weight:800;cursor:grab;touch-action:none}
.grip.pulling{cursor:grabbing;transform:scale(1.08)}
.pull-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;padding:7px 13px;border-radius:99px;
  background:rgba(10,16,32,.9);border:1px solid var(--bd);font-size:13px;font-weight:700;white-space:nowrap}

/* 결과 시트 */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(8,12,24,.74);display:flex;align-items:flex-end;
  justify-content:center;padding:16px;animation:fadein .2s;overflow-y:auto}
@keyframes fadein{from{opacity:0}}
.sheet-in{width:100%;max-width:520px;border:1px solid var(--bd);border-radius:var(--r-c);background:var(--card);
  padding:20px 18px 18px;animation:up .28s cubic-bezier(.2,1,.4,1);margin:auto 0 0}
@keyframes up{from{transform:translateY(26px);opacity:0}}
.sheet h3{margin:0 0 10px;font-size:21px;letter-spacing:-.03em;line-height:1.35}
.sheet .yr{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--pt);color:#fff;
  font-size:13px;font-weight:800;margin-bottom:9px}
.sheet .lead{margin:0 0 14px;font-size:16px;line-height:1.75;color:rgba(255,255,255,.9)}
.rule{display:flex;gap:10px;align-items:flex-start;padding:14px;border:2px solid var(--ok);
  border-radius:var(--r-s);background:var(--ok-bg);margin-bottom:14px}
.rule i{color:var(--ok);font-style:normal;font-size:18px;font-weight:800;flex:0 0 auto}
.rule p{margin:0;font-size:16px;font-weight:800;line-height:1.6}

/* 엔딩 */
.end h2{margin:0 0 8px;font-size:clamp(27px,7vw,38px);line-height:1.2;letter-spacing:-.04em;text-align:center}
.end .sub{margin:0 0 18px;text-align:center;font-size:16px;line-height:1.8;color:var(--tx2)}
.thanks{margin:0 0 18px;padding:20px 18px;border:2px solid var(--amber);border-radius:var(--r-c);
  background:linear-gradient(160deg,rgba(240,180,41,.14),rgba(240,180,41,.05));text-align:center}
.thanks p{margin:0 0 12px;font-size:clamp(16px,4.2vw,18px);line-height:1.85;color:rgba(255,255,255,.94)}
.thanks p.last{margin:0;padding-top:12px;border-top:1px solid rgba(240,180,41,.28);font-weight:800}
.thanks b{color:var(--amber)}
.recap{border:1px solid var(--bd);border-radius:var(--r-c);background:var(--bg2);padding:16px;margin-bottom:16px}
.recap div{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
.recap div+div{border-top:1px solid rgba(255,255,255,.06)}
.recap b{flex:0 0 auto;width:58px;color:var(--amber);font-size:15px;font-weight:800}
.recap span{font-size:15px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--bd);border-radius:var(--r-c);
  overflow:hidden;background:var(--bg2);margin-bottom:16px}
.stats>div{padding:13px 10px;text-align:center}
.stats>div+div{border-left:1px solid var(--bd)}
.stats span{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.stats b{font-size:20px}
.namerow{display:flex;gap:9px;margin:4px 0 12px}
.namerow input{flex:1 1 0;min-width:0;height:52px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--bd);
  background:var(--bg2);color:var(--tx);font-size:16px;font-family:inherit}
.namerow .btn{flex:0 0 auto;width:132px;min-height:52px;font-size:15px}
.src{margin-top:18px;font-size:11px;line-height:1.7;color:rgba(255,255,255,.34);text-align:center}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;padding:13px 20px;border-radius:12px;
  background:rgba(10,16,32,.96);border:1px solid var(--bd);font-size:15px;font-weight:700;max-width:90vw;text-align:center}
.dbg .hot::after{border-color:#FF2D55 !important;background:rgba(255,45,85,.12)}

@media (max-width:430px){
  .wrap{padding:12px 13px 28px}
  .scene{margin:0 -13px;width:calc(100% + 26px);border-radius:0;border-left:0;border-right:0}
  .who{gap:7px}
  .wcard b{font-size:12.5px}
  .wcard small{font-size:10.5px}
  .pc{min-width:74px;padding:11px;font-size:15px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   영이의 광복절 — 1910~1945, 35년의 이야기
   이야기가 본체이고 게임은 이해를 돕는 장치다.
   ============================================================ */
const DBG = new URLSearchParams(location.search).has("debug");
const app = document.getElementById("app");
const IMG = "assets/scenes/", PPL = "assets/people/";
const AUDIO = { story:"assets/audio/bgm-story.mp3", calm:"assets/audio/bgm-calm.mp3",
                night:"assets/audio/bgm-night.mp3", joy:"assets/audio/bgm-joy.mp3" };

/* ---------- 인물 ---------- */
const PEOPLE = [
  { id:"yu",  name:"유관순", life:"1902 ~ 1920", img:PPL+"yu.jpg",
    short:"3·1운동",

    quiz:"1919년, 아우내 장터에서 만세운동을 이끌었어요." },

/* ---------- 상태 ---------- */
const S = { view:"cover", ch:0, page:0, got:[], sub:0, score:0, done:[], sel:null, name:"", cheer:0, pull:0 };
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ch = () => CH[S.ch];

/* ---------- 소리 ---------- */
let bgm=null, bgmKey=null, ac=null, muted=false;
function actx(){ if(muted) return null; const A=window.AudioContext||window.webkitAudioContext; if(!A) return null;
  ac = ac||new A(); if(ac.state==="suspended") ac.resume(); return ac; }
function sfx(k){
  const c=actx(); if(!c) return;
  const m={ok:[660,990,.17],no:[220,150,.22],tap:[520,520,.05],win:[523,1175,.5],up:[440,880,.1],year:[300,420,.07]};
  const [f1,f2,d]=m[k]||m.tap;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
  o.type = k==="no"?"sawtooth":"sine";
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(k==="no"?.05:.09,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
}
function music(key){
  if (muted||!AUDIO[key]) { if(bgm) bgm.pause(); bgmKey=null; return; }
  if (bgmKey===key && bgm && !bgm.paused) return;
  if (!bgm) { bgm=new Audio(); bgm.loop=true; bgm.volume=.3; }
  bgm.pause(); bgm.src=AUDIO[key]; bgmKey=key; bgm.play().catch(()=>{bgmKey=null;});
}
function toggleMute(){ muted=!muted; if(muted){ if(bgm) bgm.pause(); bgmKey=null; stopSpeak(); } else music(ch().music); render(); }

let tT=null;
function toast(m){ document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d=document.createElement("div"); d.className="toast"; d.textContent=m; document.body.appendChild(d);
  clearTimeout(tT); tT=setTimeout(()=>d.remove(),2200); }

/* ---------- 읽어주기 ---------- */
const VOICE_READY = false;
let sp=null;
function stopSpeak(){ try{speechSynthesis.cancel();}catch{} if(sp){sp.pause();sp=null;}
  document.querySelectorAll(".tell p.on").forEach(p=>p.classList.remove("on")); }
function speak(lines){
  stopSpeak();
  const plain = lines.map(l=>l.replace(/<[^>]+>/g,""));
  const mark = i => document.querySelectorAll(".tell p").forEach((p,n)=>p.classList.toggle("on",n===i));
  if (VOICE_READY) {
    const a=new Audio(`assets/voice/${ch().id}-${S.page}.mp3`); sp=a; mark(0);
    a.onended=()=>{sp=null;mark(-1);}; a.onerror=()=>{sp=null;br();};
    a.play().catch(()=>{sp=null;br();}); return;
  }
  br();
  function br(){
    if(!("speechSynthesis" in window)) return;
    const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
    const sc=v=>(/natural|neural|online/i.test(v.name)?3:0)+(v.localService?0:1);
    const v=vs.sort((a,b)=>sc(b)-sc(a))[0];
    plain.forEach((line,i)=>{
      const u=new SpeechSynthesisUtterance(line);
      if(v){u.voice=v;u.lang=v.lang;} else u.lang="ko-KR";
      u.rate=.9; u.pitch=1.02;
      u.onstart=()=>mark(i);
      if(i===plain.length-1) u.onend=()=>mark(-1);
      speechSynthesis.speak(u);
    });
  }
}

/* ---------- 태극기 SVG ---------- */
function bars(broken){
  const L=46,T=7.5,G=5.5,H=(L-8)/2; let o="";
  [0,1,2].forEach(i=>{ const y=(i-1)*(T+G)-T/2;
    o += broken.includes(i)
      ? `<rect x="${-L/2}" y="${y}" width="${H}" height="${T}"/><rect x="${L/2-H}" y="${y}" width="${H}" height="${T}"/>`
      : `<rect x="${-L/2}" y="${y}" width="${L}" height="${T}"/>`;
  });
  return o;
}
const TRI = { geon:{b:[],x:75,y:50,r:-56.31}, gam:{b:[0,2],x:225,y:50,r:56.31},
              ri:{b:[1],x:75,y:150,r:56.31},  gon:{b:[0,1,2],x:225,y:150,r:-56.31} };
/* 바깥 g = 애니메이션, 안쪽 g = 위치·회전 (한 요소에 겹치면 CSS가 SVG transform을 덮어쓴다) */
function flagSvg(done){
  const on = id => done.includes(id) ? "fp on" : "fp";
  const tri = Object.entries(TRI).map(([id,t]) =>
    `<g class="${on(id)}" fill="#000"><g transform="translate(${t.x},${t.y}) rotate(${t.r})">${bars(t.b)}</g></g>`).join("");
  return `<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="태극기">
    <rect width="300" height="200" fill="#fff"/>
    <g class="${on("taegeuk")}">
      <circle cx="150" cy="100" r="50" fill="#0047a0"/>
      <path d="M100,100 A50,50 0 0,1 200,100 A25,25 0 0,0 150,100 A25,25 0 0,1 100,100 Z" fill="#cd2e3a"/>
    </g>${tri}</svg>`;
}
function hinomaruSvg(){
  return `<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="일본 국기">
    <rect width="300" height="200" fill="#fff" stroke="#DDD" stroke-width="2"/>
    <circle cx="150" cy="100" r="60" fill="#BC002D"/></svg>`;
}
function pieceIcon(id){
  if (id === "taegeuk")
    return `<svg class="pcbar" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#0047a0"/>
      <path d="M3,20 A17,17 0 0,1 37,20 A8.5,8.5 0 0,0 20,20 A8.5,8.5 0 0,1 3,20 Z" fill="#cd2e3a"/></svg>`;
  const t = TRI[id];
  return `<svg class="pcbar" viewBox="-30 -22 60 44" fill="#fff">${bars(t.b)}</svg>`;
}

/* ---------- 공통 ---------- */
function hud(){
  return `<div class="hud"><div class="hud-in">
    <span class="pill year">${esc(ch().year)}</span>
    <span class="pill">${S.ch+1} / ${CH.length}</span>
    <span class="hud-r"><button class="pill" id="mute">${muted?"🔇":"🔊"}</button></span>
  </div><div class="pbar"><i style="width:${Math.round((S.ch)/CH.length*100)}%"></i></div></div>`;
}
function head(){ return `<div class="head"><i>${S.ch+1}</i><b>${esc(ch().year)}</b></div>`; }
function bindHud(){ const m=document.getElementById("mute"); if(m) m.onclick=toggleMute; }
function shell(inner, foot){
  const c = ch();
  return hud() + `<div class="wrap">${head()}
    <h2 class="t">${esc(c.title)}</h2>
    ${c.ask ? `<p class="ask">${esc(c.ask)}</p>` : `<div style="height:10px"></div>`}
    ${inner}${foot||""}</div>`;
}
/* 스테이지 완료 시트 */
function finishChapter(){
  const c = ch();
  sfx("win");
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="sheet-in">
    ${c.after ? `<div class="pic" style="margin-bottom:14px"><img src="${c.after}" alt=""></div>` : ""}
    <h3>${esc(c.done)}</h3>
    <div class="rule"><i>✓</i><p>${esc(c.rule)}</p></div>
    <button class="btn" id="ok">${S.ch < CH.length-1 ? "다음 이야기 →" : "끝내기 →"}</button>
  </div>`;
  document.body.appendChild(el);
  el.querySelector("#ok").onclick = () => {
    el.remove(); sfx("tap");
    if (S.ch < CH.length-1) { S.ch++; S.view="story"; S.page=0; S.got=[]; S.sub=0; S.sel=null; S.cheer=0; S.pull=0; }
    else S.view = "end";
    render();
  };
}

/* ---------- 화면 ---------- */

  document.body.classList.toggle("dbg", DBG);
  if (S.view !== "story") stopSpeak();
  if (S.view === "cover") return viewCover();
  if (S.view === "story") return viewStory();
  if (S.view === "end")   return viewEnd();
  ({ years:viewYears, find:viewFind, pick:viewPick, people:viewPeople,
     cheer:viewCheer, flag:viewFlag, raise:viewRaise, quiz:viewPick })[ch().kind]();
}

      ${c.spots.map(s=>{

      }).join("")}

/* 6장 — 게양(줄 당기기) */
function viewRaise(){
  const c = ch();
  const pct = Math.min(100, S.pull);
  const up = pct >= 100;
  app.innerHTML = shell(`
    <div class="pole" id="pole">
      <img class="pole-bg" src="${esc(c.img)}" alt="" />
      <div class="pole-stick"></div><div class="pole-top"></div>
      <div class="pole-flag${up?" up":""}" id="flag" style="bottom:calc(6% + ${pct*0.66}%)">
        ${flagSvg(["taegeuk","geon","gam","ri","gon"])}</div>
      <div class="rope" id="rope"><div class="grip" id="grip" style="top:${8 + pct*0.62}%">⬇</div></div>
    </div>
    <p style="margin:14px 0 0;text-align:center;font-size:18px;font-weight:800;color:var(--amber)">
      ${up ? "태극기가 다 올라갔어요!" : `${Math.round(pct)}%`}</p>`,
    up ? `<div style="flex:1;min-height:12px"></div><button class="btn" id="done">다 올렸어요 →</button>` : "");
  bindHud();
  if (up) { document.getElementById("done").onclick = () => { sfx("win"); finishChapter(); }; return; }

  const pole = document.getElementById("pole"), grip = document.getElementById("grip");
  let dragging = false, lastY = 0;
  const start = e => {
    dragging = true; lastY = (e.touches ? e.touches[0] : e).clientY;
    grip.classList.add("pulling");
    if (e.pointerId != null && grip.setPointerCapture) grip.setPointerCapture(e.pointerId);
  };
  const move = e => {
    if (!dragging) return;
    const y = (e.touches ? e.touches[0] : e).clientY;
    const dy = y - lastY;
    if (dy > 0) {              /* 아래로 당길 때만 올라간다 */
      const h = pole.getBoundingClientRect().height || 1;
      S.pull = Math.min(100, S.pull + dy / h * 150);
      lastY = y;
      const p = Math.min(100, S.pull);
      document.getElementById("flag").style.bottom = `calc(6% + ${p*0.66}%)`;
      grip.style.top = (8 + p*0.62) + "%";
      pole.parentElement.querySelector("p").textContent = `${Math.round(p)}%`;
      if (p % 20 < 3) sfx("up");
      if (p >= 100) { dragging = false; sfx("win"); S.score += 30; setTimeout(render, 200); }
    } else lastY = y;
  };
  const end = () => { dragging = false; grip.classList.remove("pulling"); };
  grip.addEventListener("pointerdown", start);
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  grip.addEventListener("touchstart", start, {passive:true});
  window.addEventListener("touchmove", move, {passive:true});
  window.addEventListener("touchend", end);
}

  </div>`;
  music("joy");
  document.getElementById("cert").onclick = makeCert;
  document.getElementById("again").onclick = () => { S.view="cover"; render(); };
}

function makeCert(){
  const nm = (document.getElementById("nm").value||"").trim();
  if (!nm) return toast("이름을 먼저 써 주세요");
  S.name = nm;
  const W=900,H=640,cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  x.fillStyle="#FFFDF6"; x.fillRect(0,0,W,H);
  x.strokeStyle="#CD2E3A"; x.lineWidth=8; x.strokeRect(20,20,W-40,H-40);
  x.strokeStyle="#0047A0"; x.lineWidth=2; x.strokeRect(34,34,W-68,H-68);
  const F=(s,w)=>`${w||700} ${s}px "Pretendard Variable",Pretendard,sans-serif`;
  x.textAlign="center"; x.fillStyle="#1B2540";
  x.font=F(40,800); x.fillText("광복절 역사 지킴이", W/2, 116);
  x.font=F(18,600); x.fillStyle="#6B7695"; x.fillText("1945년 8월 15일 광복 기념", W/2, 148);
  x.font=F(56,800); x.fillStyle="#CD2E3A"; x.fillText(nm, W/2, 240);
  x.font=F(20,600); x.fillStyle="#1B2540";
  ["위 어린이는 1910년부터 1945년까지","35년 동안의 우리 역사를 끝까지 배우고,","태극기를 바르게 만들어 높이 올렸으므로","이 상장을 드립니다."].forEach((t,i)=>x.fillText(t, W/2, 305+i*34));
  x.font=F(19,700); x.fillStyle="#0047A0"; x.fillText(`점수 ${S.score}점`, W/2, 462);
  const cx=W/2, cy=534, r=32;
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fillStyle="#0047A0"; x.fill();
  x.beginPath(); x.arc(cx,cy,r,Math.PI,0,false); x.arc(cx+r/2,cy,r/2,0,Math.PI,true);
  x.arc(cx-r/2,cy,r/2,0,Math.PI,false); x.closePath(); x.fillStyle="#CD2E3A"; x.fill();
  x.font=F(15,600); x.fillStyle="#8A93AD"; x.fillText("kimju.zip", W/2, H-44);
  const a=document.createElement("a");
  a.download=`광복절_역사지킴이_${nm}.png`; a.href=cv.toDataURL("image/png"); a.click();
  sfx("win"); toast("상장을 저장했어요!");
}

render();
</script>
</body>
</html>
